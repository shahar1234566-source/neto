<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
__STYLE__
<style>
.shell{max-width:520px}
.spin{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);padding:40px}
.spin:before{content:"";width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#fdecea;color:#8a1c14;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.card .ph img[data-noimg]{object-fit:none}
.noimg{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--muted);font-size:13px;background:var(--paper);border-radius:10px}
.linkrow{display:flex;gap:6px;flex-wrap:wrap}
.small{font-size:12.5px}
.mini{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:13px;text-decoration:none;color:var(--ink);white-space:nowrap}
.mini.wa{border-color:#1fa855;color:#137a3c}
</style>
</head>
<body>
<div class="shell" id="shell">
  <div id="app" style="flex:1;display:flex;flex-direction:column;min-height:0;position:relative"></div>
</div>
<script>
window.__errs=[];
window.onerror=function(m,s,l,c,e){window.__errs.push(String(m)+" @"+l+":"+c);showDiag();};
window.addEventListener("unhandledrejection",function(e){window.__errs.push("promise: "+(e.reason&&e.reason.message||e.reason));showDiag();});
function showDiag(){var a=document.getElementById("app");if(!a)return;if(a.children.length&&!window.__forceDiag)return;
a.innerHTML='<div style="padding:20px;font:15px Arial;direction:rtl"><b>שגיאה בטעינה</b><p>צלם מסך ושלח ל-Claude:</p><pre style="white-space:pre-wrap;direction:ltr;font-size:12px;background:#f3f3f3;padding:8px">'+window.__errs.join("\n").replace(/</g,"&lt;")+"\n"+navigator.userAgent+'</pre></div>';}
setTimeout(function(){var a=document.getElementById("app");if(a&&!a.children.length){window.__errs.push("timeout: nothing rendered");showDiag();}},4000);
</script>
<script>
const BOOT=__BOOT__;
const ZONES=["קפוא","מצונן","יבש","חד-פעמי וניקיון"];
const LS={get(k){try{return localStorage.getItem("neto_"+k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem("neto_"+k):localStorage.setItem("neto_"+k,v)}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtD=t=>new Date(t).toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"numeric"});
const fmtT=t=>new Date(t).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
function call(action,p){return new Promise((res,rej)=>{google.script.run.withSuccessHandler(r=>{if(r&&r.error){if(r.error==="SESSION"){logout(true);rej(new Error("החיבור פג. היכנס שוב."));}else rej(new Error(r.error))}else res(r)}).withFailureHandler(e=>rej(new Error(e&&e.message||"שגיאת תקשורת. בדוק את החיבור לאינטרנט."))).api(action,p)})}

const app=document.getElementById("app");
let S={mode:LS.get("mode")||(BOOT.params.admin?"admin":"customer"),token:LS.get("token"),tab:"catalog",zone:"קפוא",sub:null,q:"",cart:JSON.parse(LS.get("cart")||"{}"),unit:JSON.parse(LS.get("unit")||"{}"),note:"",voice:null,data:null,admin:null,adminTab:"orders",openOrder:null,last:null,busy:false,promoSeen:false};
const P=()=>Object.fromEntries((S.data?.products||[]).map(p=>[p.id,p]));
function save(){LS.set("cart",JSON.stringify(S.cart));LS.set("unit",JSON.stringify(S.unit))}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;app.appendChild(t);setTimeout(()=>t.remove(),3000)}
function logout(silent){S.token=null;LS.set("token",null);S.data=null;S.admin=null;render();if(silent)toast("החיבור פג. היכנס שוב.")}
const logoImg=cls=>BOOT.logo?`<img class="${cls||"logo"}" src="${BOOT.logo}" alt="Neto">`:`<b class="logo" style="font-family:var(--f-display);color:var(--brand);font-size:24px">Neto</b>`;
function cartTotals(){let c=0,u=0;for(const[id,q]of Object.entries(S.cart)){if(!q)continue;(S.unit[id]||"c")==="c"?c+=q:u+=q}return{c,u}}
const cartCount=()=>Object.values(S.cart).filter(q=>q>0).length;

/* ---------- boot ---------- */
function urlParams(){return new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v||{})}};setTimeout(()=>fin({}),2500);try{google.script.url.getLocation(l=>fin(l&&l.parameter))}catch(e){fin({})}})}
async function start(){
  if(!BOOT.params.c){const q=await urlParams();if(q.u){BOOT.params.c=q.u;BOOT.params.k=q.k||""}if(q.admin)BOOT.params.admin=q.admin}
  if(BOOT.params.c&&BOOT.params.k&&S.mode==="customer"){
    try{const r=await call("login",{c:BOOT.params.c,k:BOOT.params.k});S.token=r.token;LS.set("token",r.token);LS.set("mode","customer")}catch(e){S.loginErr=e.message}
  }
  render();
}
function render(){
  if(!S.token) return renderLogin();
  if(S.mode==="admin"){ if(!S.admin){loadAdmin();return spinner("טוען הזמנות…")} return renderAdmin() }
  if(!S.data){loadCatalog();return spinner("טוען את הקטלוג…")}
  renderCustomer();
}
function spinner(t){app.innerHTML=`<header class="top">${logoImg()}<div class="who"><b>${esc(BOOT.business)}</b></div></header><div class="spin">${t}</div>`}
async function loadCatalog(){try{S.data=await call("catalog",{token:S.token});const ids=new Set(S.data.products.map(p=>p.id));for(const k in S.cart)if(!ids.has(k))delete S.cart[k];render()}catch(e){app.innerHTML=`<div class="login"><div class="err">${esc(e.message)}</div><button class="btn" onclick="location.reload()">נסה שוב</button></div>`}}
async function loadAdmin(){try{S.admin=await call("adminData",{token:S.token});render()}catch(e){app.innerHTML=`<div class="login"><div class="err">${esc(e.message)}</div><button class="btn" onclick="location.reload()">נסה שוב</button></div>`}}

/* ---------- login ---------- */
function renderLogin(){
  const isA=S.mode==="admin";
  app.innerHTML=`<div class="login">
    ${logoImg()}
    <p>${isA?"כניסת מנהל":"הזמנת סחורה מ"+esc(BOOT.business)}</p>
    ${S.loginErr?`<div class="err">${esc(S.loginErr)}</div>`:""}
    ${isA?"":`<label class="f" for="lg1">קוד לקוח</label><input class="t" id="lg1" inputmode="numeric" autocomplete="username" value="${esc(LS.get("code")||"")}">`}
    <label class="f" for="lg2">סיסמה</label>
    <input class="t" id="lg2" type="password" inputmode="numeric" autocomplete="current-password">
    <div class="btns"><button class="btn" id="lgo">כניסה</button></div>
    <p class="note" style="margin-top:14px;text-align:center"><a href="#" id="sw" style="color:var(--muted)">${isA?"כניסת לקוח":"כניסת מנהל"}</a></p>
  </div>`;
  const go=async()=>{const b=document.getElementById("lgo");b.disabled=true;b.textContent="נכנס…";
    try{ if(isA){const r=await call("adminLogin",{pass:document.getElementById("lg2").value});S.token=r.token}
      else{const code=document.getElementById("lg1").value.trim();const r=await call("login",{code,pass:document.getElementById("lg2").value});S.token=r.token;LS.set("code",code)}
      LS.set("token",S.token);LS.set("mode",S.mode);S.loginErr=null;render();
    }catch(e){S.loginErr=e.message;renderLogin()}};
  document.getElementById("lgo").onclick=go;
  document.getElementById("lg2").onkeydown=e=>{if(e.key==="Enter")go()};
  document.getElementById("sw").onclick=e=>{e.preventDefault();S.mode=isA?"customer":"admin";S.loginErr=null;renderLogin()};
}

/* ---------- customer ---------- */
function renderCustomer(){
  const c=S.data.customer,n=cartCount();let body="";
  if(S.tab==="catalog")body=catalogView();else if(S.tab==="again")body=againView();else if(S.tab==="cart")body=cartView();else if(S.tab==="done")body=doneView();
  const t=cartTotals();
  app.innerHTML=`<header class="top">${logoImg()}<div class="who"><b>${esc(c.name)}</b><small>לקוח ${esc(c.code)}${c.addr?" · "+esc(c.addr):""}</small></div><div class="spacer"></div><button class="iconbtn" id="out">יציאה</button></header>
  <main id="main">${body}</main>
  ${n&&S.tab==="catalog"?`<button class="cartbar" id="gocart">לסיכום ההזמנה <span>${n} מוצרים · ${t.c} קרט׳${t.u?" + "+t.u+" יח׳":""}</span></button>`:""}
  <nav class="tabs">
    <button data-tab="catalog" ${S.tab==="catalog"?'aria-current="page"':""}><span class="i">▦</span>קטלוג</button>
    <button data-tab="again" ${S.tab==="again"?'aria-current="page"':""}><span class="i">↻</span>הזמן שוב</button>
    <button data-tab="cart" ${S.tab==="cart"?'aria-current="page"':""}><span class="i">🛒</span>ההזמנה שלי${n?`<span class="badge">${n}</span>`:""}</button>
  </nav>`;
  wireCustomer();
  if(!S.promoSeen&&S.tab==="catalog"&&S.data.promos.length)showPromo();
}
function zonesPresent(){return ZONES.filter(z=>S.data.products.some(p=>p.cat===z))}
function subsOf(z){return[...new Set(S.data.products.filter(p=>p.cat===z).map(p=>p.sub))]}
function catalogView(){
  const c=S.data.customer,q=S.q.trim(),zs=zonesPresent();
  if(!zs.includes(S.zone))S.zone=zs[0];
  const list=S.data.products.filter(p=>q?(p.name.includes(q)||p.item.includes(q)||p.barcode.includes(q)):(p.cat===S.zone&&(!S.sub||p.sub===S.sub)));
  const zones=zs.map(z=>`<button class="zone" data-z="${z}" aria-pressed="${!q&&S.zone===z}">${z==="חד-פעמי וניקיון"?"חד-פעמי":z}<small>${S.data.products.filter(p=>p.cat===z).length} מוצרים</small></button>`).join("");
  const chips=q?"":`<div class="chips"><button class="chip" data-sub="" aria-pressed="${!S.sub}">הכול</button>${subsOf(S.zone).map(s=>`<button class="chip" data-sub="${esc(s)}" aria-pressed="${S.sub===s}">${esc(s)}</button>`).join("")}</div>`;
  return `${c.cutoff||c.days?`<div class="cutoff">⏰ <div>${c.cutoff?`הזמנה עד <b>${esc(c.cutoff)}</b>`:"הזמנה"}${c.days?` · ימי אספקה: ${esc(c.days)}`:""}</div></div>`:""}
  <div class="zones" style="grid-template-columns:repeat(${zs.length},1fr)">${zones}</div>
  <div class="searchrow"><input id="q" type="search" placeholder="חיפוש לפי שם, מק״ט או ברקוד" value="${esc(S.q)}" aria-label="חיפוש מוצר">
    <label class="iconbtn" for="scan" style="display:flex;align-items:center">▮▯▮ ברקוד</label><input id="scan" type="file" accept="image/*" capture="environment" hidden></div>
  ${chips}${q?`<p class="note">${list.length} תוצאות עבור "${esc(q)}"</p>`:""}
  <div class="grid">${list.map(cardHTML).join("")||`<div class="empty">לא נמצא מוצר. נסה שם אחר, מק״ט או ברקוד.</div>`}</div>`;
}
const imgTag=(p,cls)=>p.img?`<img ${cls?`class="${cls}"`:""} src="${p.img}" alt="${esc(p.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=noimg>אין תמונה</div>'">`:`<div class="noimg">אין תמונה</div>`;
function cardHTML(p){const q=S.cart[p.id]||0,un=S.unit[p.id]||"c";
  return `<div class="card ${q?"on":""}"><button class="ph" data-open="${p.id}" aria-label="פרטי ${esc(p.name)}">${imgTag(p)}${p.tag?`<span class="tag">${esc(p.tag)}</span>`:""}</button>
  <div class="body"><div class="nm">${esc(p.name)}</div><div class="meta">${p.item?"מק״ט "+p.item:""}${p.carton?` · ${p.carton} יח׳ בקרטון`:""}</div>
  <div class="qty"><div class="step"><button data-inc="${p.id}" aria-label="הוסף">+</button><input data-qty="${p.id}" inputmode="numeric" value="${q||""}" placeholder="0" aria-label="כמות"><button data-dec="${p.id}" aria-label="הפחת">−</button></div>
  <div class="unit" role="group" aria-label="יחידת הזמנה"><button data-unit="${p.id}" data-u="c" aria-pressed="${un==="c"}">קרטון</button><button data-unit="${p.id}" data-u="u" aria-pressed="${un==="u"}">יח׳</button></div></div></div></div>`}
function againView(){
  const o=S.data.orders;const PP=P();
  if(!o.length)return `<h2>הזמן שוב</h2><div class="empty">עוד אין הזמנות קודמות. אחרי ההזמנה הראשונה תוכל לטעון אותה כאן בלחיצה.</div>`;
  return `<h2>הזמן שוב</h2><p class="note">טוען הזמנה קודמת לסל. אפשר לשנות כמויות לפני השליחה.</p>`+o.map(x=>`<div class="panel"><div style="display:flex;align-items:center;gap:8px"><b>הזמנה ${x.no}</b>${pill(x.status)}<span class="meta" style="margin-inline-start:auto">${fmtD(x.at)}</span></div>
    ${x.lines.slice(0,4).map(l=>`<div class="row"><div class="grow">${esc(l.name)}</div><div class="q">${l.q} ${l.unit==="קרטון"?"קרט׳":"יח׳"}</div></div>`).join("")}${x.lines.length>4?`<div class="note">ועוד ${x.lines.length-4} מוצרים</div>`:""}
    <div class="btns"><button class="btn" data-reorder="${x.no}">טען את ההזמנה לסל</button>${x.pdf?`<a class="btn sec" style="text-align:center;text-decoration:none" href="${x.pdf}" target="_blank" rel="noopener">📄 טופס ההזמנה (PDF)</a>`:""}</div></div>`).join("");
}
function cartView(){
  const PP=P(),ids=Object.keys(S.cart).filter(id=>S.cart[id]>0&&PP[id]);
  if(!ids.length)return `<h2>ההזמנה שלי</h2><div class="empty">הסל ריק. בחר מוצרים בקטלוג או טען הזמנה קודמת ב"הזמן שוב".</div>`;
  const t=cartTotals(),c=S.data.customer;
  const byZone=ZONES.map(z=>{const zs=ids.filter(id=>PP[id].cat===z);if(!zs.length)return"";
    return `<span class="zonehead zh-${z}">${z} · ${zs.length}</span>`+zs.map(id=>`<div class="row">${PP[id].img?`<img src="${PP[id].img}" alt="" referrerpolicy="no-referrer">`:""}<div class="grow"><div style="font-weight:600;font-size:14.5px">${esc(PP[id].name)}</div><div class="meta">${PP[id].item?"מק״ט "+PP[id].item:""}</div></div>
      <div class="step" style="flex:0 0 112px"><button data-inc="${id}">+</button><input data-qty="${id}" inputmode="numeric" value="${S.cart[id]}" aria-label="כמות"><button data-dec="${id}">−</button></div><div class="q" style="width:42px">${(S.unit[id]||"c")==="c"?"קרט׳":"יח׳"}</div></div>`).join("")}).join("");
  return `<h2>סיכום ההזמנה</h2>
  <div class="panel"><div class="sum"><div><b>${ids.length}</b><small>מוצרים</small></div><div><b>${t.c}</b><small>קרטונים</small></div><div><b>${t.u}</b><small>יחידות</small></div></div>${c.days||c.cutoff?`<div class="note">${c.days?"אספקה: "+esc(c.days):""}${c.cutoff?" · הזמנה עד "+esc(c.cutoff):""}</div>`:""}</div>
  <div class="panel">${byZone}</div>
  <div class="panel"><label class="f" for="note" style="margin-top:0">הערות להזמנה</label><textarea id="note" placeholder="למשל: להביא עד 10 בבוקר, להחליף מוצר אם חסר">${esc(S.note)}</textarea>
  <label class="f">הערה קולית</label>
  <div class="linkrow"><button class="btn sec" id="rec" style="flex:1">🎙 ${S.voice?"הקלטה מוכנה ("+Math.round(S.voice.size/1024)+" KB) · הקלט מחדש":"הקלט הודעה"}</button><label class="btn sec" for="voiceFile" style="flex:0 0 auto;width:auto">צרף קובץ</label></div>
  <input id="voiceFile" type="file" accept="audio/*" capture hidden>${S.voice?`<button class="mini" id="rmVoice" style="margin-top:6px">הסר הקלטה</button>`:""}</div>
  <div class="btns"><button class="btn" id="send" ${S.busy?"disabled":""}>${S.busy?"שולח…":"שלח הזמנה"}</button><button class="btn sec" data-tab="catalog">המשך לבחור מוצרים</button></div>`;
}
function doneView(){
  const o=S.last,c=S.data.customer,ow=S.data.owner;
  const text=`הזמנה ${o.no} מ${c.name} (${c.code})\n${fmtD(o.at)} ${fmtT(o.at)}\n`+o.lines.map(l=>`• ${l.name} – ${l.q} ${l.u==="c"?"קרט׳":"יח׳"}${l.item?" (מק״ט "+l.item+")":""}`).join("\n")+(o.note?`\nהערות: ${o.note}`:"")+`\n\n📄 טופס ההזמנה: ${o.pdfUrl}`;
  return `<div class="ok-hero"><div class="tick">✓</div><h2>ההזמנה התקבלה</h2><div class="note">הזמנה מס׳ ${o.no} · ${fmtD(o.at)} ${fmtT(o.at)}</div></div>
  <div class="panel"><div class="sum"><div><b>${o.count}</b><small>מוצרים</small></div><div><b>${o.cartons}</b><small>קרטונים</small></div><div><b>${o.units}</b><small>יחידות</small></div></div>
  <p class="note" style="margin:6px 0 0">ההזמנה נשלחה ל${esc(BOOT.business)} במייל, עם טופס PDF.</p></div>
  <div class="btns">${ow.wa?`<a class="btn wa" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${ow.wa}?text=${encodeURIComponent(text)}">שלח גם בוואטסאפ</a>`:""}
  <a class="btn sec" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${o.pdfUrl}">📄 פתח / הדפס את טופס ההזמנה</a>
  <button class="btn sec" data-tab="catalog">חזרה לקטלוג</button></div>`;
}
function showPromo(){S.promoSeen=true;const pr=S.data.promos[0],p=P()[pr.id];
  const m=document.createElement("div");m.className="center";m.innerHTML=`<div class="promo" role="dialog"><span class="kick">מבצע</span><h2 style="margin-top:10px">${esc(pr.title)}</h2>${p&&p.img?`<img src="${p.img}" alt="" referrerpolicy="no-referrer">`:""}<p class="note">${esc(pr.text||"")}</p>
  <div class="btns">${p?`<button class="btn" id="pAdd">הוסף קרטון להזמנה</button>`:""}<button class="btn sec" id="pX">סגור</button></div></div>`;app.appendChild(m);
  const a=m.querySelector("#pAdd");if(a)a.onclick=()=>{S.cart[p.id]=(S.cart[p.id]||0)+1;save();m.remove();render();toast("נוסף קרטון להזמנה")};m.querySelector("#pX").onclick=()=>m.remove()}
function openDetail(id){const p=P()[id],q=S.cart[id]||0,un=S.unit[id]||"c";
  const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="sheet" role="dialog"><button class="x" aria-label="סגור">✕</button><h2 style="margin-top:4px">${esc(p.name)}</h2>
  ${p.img?`<img class="big" src="${p.img.replace("sz=w400","sz=w900")}" alt="${esc(p.name)}" referrerpolicy="no-referrer">`:""}
  <dl class="dl"><dt>מק״ט</dt><dd>${p.item||"—"}</dd><dt>ברקוד</dt><dd>${p.barcode||"—"}</dd><dt>יח׳ בקרטון</dt><dd>${p.carton||"—"}</dd><dt>מחלקה</dt><dd>${esc(p.cat)} · ${esc(p.sub)}</dd></dl>
  <div class="qty"><div class="step"><button data-inc="${id}">+</button><input data-qty="${id}" inputmode="numeric" value="${q||""}" placeholder="0"><button data-dec="${id}">−</button></div>
  <div class="unit"><button data-unit="${id}" data-u="c" aria-pressed="${un==="c"}">קרטון</button><button data-unit="${id}" data-u="u" aria-pressed="${un==="u"}">יח׳</button></div></div>
  <div class="btns"><button class="btn" id="dOk">סיום</button></div></div>`;app.appendChild(m);
  const close=()=>{m.remove();keepScroll(render)};m.querySelector(".x").onclick=close;m.querySelector("#dOk").onclick=close;m.onclick=e=>{if(e.target===m)close()};
  wireQty(m,()=>{m.querySelector(`[data-qty="${id}"]`).value=S.cart[id]||"";m.querySelectorAll("[data-unit]").forEach(b=>b.setAttribute("aria-pressed",(S.unit[id]||"c")===b.dataset.u))})}
function wireQty(root,after){
  root.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{const id=b.dataset.inc;S.cart[id]=(S.cart[id]||0)+1;save();after()});
  root.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{const id=b.dataset.dec;S.cart[id]=Math.max(0,(S.cart[id]||0)-1);save();after()});

function keepScroll(fn){const m=document.getElementById("main"),y=m?m.scrollTop:0;fn();const n=document.getElementById("main");if(n)n.scrollTop=y}
let recorder=null,chunks=[];
function wireCustomer(){
  const main=document.getElementById("main");
  document.getElementById("out").onclick=()=>logout();
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();document.getElementById("main").scrollTop=0});
  const gc=document.getElementById("gocart");if(gc)gc.onclick=()=>{S.tab="cart";render()};
  main.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{S.zone=b.dataset.z;S.sub=null;S.q="";render()});
  main.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{S.sub=b.dataset.sub||null;keepScroll(render)});
  main.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
  wireQty(main,()=>keepScroll(render));
  const q=document.getElementById("q");if(q)q.oninput=()=>{S.q=q.value;const pos=q.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos)};
  const sc=document.getElementById("scan");if(sc)sc.onchange=async()=>{const f=sc.files[0];if(!f)return;
    if(!("BarcodeDetector" in window)){toast("הסורק לא נתמך בטלפון הזה. הקלד את הברקוד בחיפוש.");return}
    try{const r=await new BarcodeDetector({formats:["ean_13","ean_8","upc_a"]}).detect(await createImageBitmap(f));if(!r.length){toast("לא זוהה ברקוד. צלם מקרוב ובאור טוב.");return}
      const code=r[0].rawValue,p=S.data.products.find(x=>x.barcode===code);if(p){S.cart[p.id]=(S.cart[p.id]||0)+1;save();render();toast("נוסף: "+p.name)}else{S.q=code;render();toast("ברקוד "+code+" לא נמצא בקטלוג")}}catch(e){toast("לא הצלחתי לקרוא את התמונה")}};
  main.querySelectorAll("[data-reorder]").forEach(b=>b.onclick=()=>{const o=S.data.orders.find(x=>x.no==+b.dataset.reorder),PP=P();let miss=0;
    o.lines.forEach(l=>{const p=Object.values(PP).find(x=>x.item&&x.item===l.item)||Object.values(PP).find(x=>x.barcode&&x.barcode===l.barcode);if(p){S.cart[p.id]=l.q;S.unit[p.id]=l.unit==="יחידה"?"u":"c"}else miss++});save();S.tab="cart";render();toast(miss?`נטען. ${miss} מוצרים כבר לא בקטלוג.`:"ההזמנה הקודמת נטענה לסל")});
  const note=document.getElementById("note");if(note)note.oninput=()=>S.note=note.value;
  const vf=document.getElementById("voiceFile");if(vf)vf.onchange=()=>{const f=vf.files[0];if(f){if(f.size>8e6){toast("הקובץ גדול מדי (עד 8MB)");return}S.voice=f;keepScroll(render)}};
  const rm=document.getElementById("rmVoice");if(rm)rm.onclick=()=>{S.voice=null;keepScroll(render)};
  const rec=document.getElementById("rec");if(rec)rec.onclick=async()=>{
    if(recorder&&recorder.state==="recording"){recorder.stop();return}
    try{const st=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(st);
      recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{st.getTracks().forEach(t=>t.stop());const b=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});b.name="הקלטה."+((recorder.mimeType||"").includes("mp4")?"m4a":"webm");S.voice=b;keepScroll(render)};
      recorder.start();rec.textContent="⏹ עצור הקלטה";rec.style.background="#fdecea"}catch(e){toast("אין גישה למיקרופון. אפשר לצרף קובץ במקום.")}};
  const send=document.getElementById("send");if(send)send.onclick=sendOrder;
}
async function sendOrder(){
  const PP=P(),lines=Object.keys(S.cart).filter(id=>S.cart[id]>0&&PP[id]).map(id=>[id,S.cart[id],S.unit[id]||"c"]);
  if(!lines.length)return;S.busy=true;keepScroll(render);
  try{let voice=null;if(S.voice){const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(S.voice)});voice={b64,mime:S.voice.type||"audio/mpeg",name:S.voice.name||"הקלטה"}}
    const r=await call("submit",{token:S.token,lines,note:S.note,voice});
    S.last={...r,note:S.note,lines:lines.map(([id,q,u])=>({name:PP[id].name,item:PP[id].item,q,u}))};
    S.cart={};S.unit={};save();S.note="";S.voice=null;S.busy=false;S.tab="done";render();
    call("catalog",{token:S.token}).then(d=>{S.data=d}).catch(()=>{});
  }catch(e){S.busy=false;keepScroll(render);toast("ההזמנה לא נשלחה: "+e.message)}
}

  <div class="btns"><button class="btn" id="pr_save">שמור</button>${row?`<button class="btn sec" id="pr_del" style="color:#b3271e">מחק מבצע</button>`:""}</div>`);
  m.querySelector("#pr_save").onclick=async e=>{const v=id=>m.querySelector("#"+id).value.trim();if(!v("pr_t")){toast("חסרה כותרת");return}e.target.disabled=true;
    const ok=await adminSave("saveRow",{kind:"promos",row:row||null,data:{"כותרת":v("pr_t"),"טקסט":v("pr_x"),'מק"ט':v("pr_p").split("–")[0].trim(),"פעיל":m.querySelector("#pr_a").checked}},"המבצע נשמר");if(!ok)e.target.disabled=false};
  const d=m.querySelector("#pr_del");if(d)d.onclick=()=>confirmBox("למחוק את המבצע?","מחק",()=>adminSave("deleteRow",{kind:"promos",row,check:String(pr["פעיל"])},"המבצע נמחק"));
}

/* --- settings --- */
function settingsView(){const s=A().settings,a=A();
  return `<h2>הגדרות</h2>
  <div class="panel"><b>פרטי העסק</b>${fld("שם העסק","s_biz",s["שם העסק"])}${fld("מייל לקבלת הזמנות","s_mail",s["מייל הזמנות"],'inputmode="email"')}${fld("וואטסאפ לקבלת הזמנות","s_wa",s["וואטסאפ"],'inputmode="tel"')}</div>
  <div class="panel"><b>הזמנות ותזכורות</b>${fld("שעת סגירה (ברירת מחדל)","s_cut",s["שעת סגירה"],'placeholder="14:00"')}
  <label class="f" for="s_rh">שעת תזכורת ללקוחות (ברירת מחדל)</label>${hourSelect("s_rh",s["שעת תזכורת"],"—")}
  <label class="f" for="s_rt">נוסח התזכורת</label><textarea id="s_rt">${esc(s["נוסח תזכורת"]||"")}</textarea><p class="note small">{שם} ו-{שעת סגירה} מתמלאים לבד.</p>
  <label class="toggle" style="margin-top:10px"><input type="checkbox" id="s_sum" ${String(s["סיכום יומי"]).trim()!=="כבוי"?"checked":""}> לשלוח לי כל יום סיכום של מי שלא הזמין</label>
  <label class="f" for="s_sh">שעת הסיכום</label>${hourSelect("s_sh",s["שעת סיכום"]||"13","—")}</div>
  <div class="panel"><b>אבטחה</b>${fld("סיסמת מנהל","s_pw",s["סיסמת מנהל"])}</div>
  <div class="btns"><button class="btn" id="s_save">שמור הגדרות</button></div>
  <div class="panel" style="margin-top:14px"><b>מתקדם</b><p class="note">כל הנתונים נשמרים בגיליון של גוגל. בדרך כלל אין צורך לפתוח אותו.</p><div class="linkrow"><a class="mini" href="${a.sheetUrl}" target="_blank" rel="noopener">פתח את הגיליון</a><a class="mini" href="${a.folderUrl}" target="_blank" rel="noopener">תיקיית Drive</a></div></div>`}

/* --- wiring --- */
function wireAdmin(){
  document.getElementById("out").onclick=()=>logout();
  document.getElementById("refresh").onclick=()=>{S.admin=null;render()};
  app.querySelectorAll("[data-at]").forEach(b=>b.onclick=()=>{S.adminTab=b.dataset.at;S.openOrder=null;render();document.getElementById("main").scrollTop=0});
  const search=(id,key)=>{const i=document.getElementById(id);if(i)i.oninput=()=>{S.af[key]=i.value;const pos=i.selectionStart;keepScroll(render);const n=document.getElementById(id);n.focus();n.setSelectionRange(pos,pos)}};
  search("oq","oq");search("cq","cq");search("pq","pq");
  app.querySelectorAll("[data-ost]").forEach(b=>b.onclick=()=>{S.af.st=b.dataset.ost;render()});
  app.querySelectorAll("[data-oo]").forEach(b=>b.onclick=()=>{S.openOrder=+b.dataset.oo;render();document.getElementById("main").scrollTop=0});
  const bk=document.getElementById("back");if(bk)bk.onclick=()=>{S.openOrder=null;render()};
  app.querySelectorAll("[data-st]").forEach(b=>b.onclick=async()=>{const go=async()=>{b.disabled=true;try{await call("setStatus",{token:S.token,no:S.openOrder,status:b.dataset.st});A().orders.find(o=>o.no===S.openOrder).status=b.dataset.st;render();toast("עודכן: "+b.dataset.st)}catch(e){b.disabled=false;toast(e.message)}};b.dataset.st==="בוטלה"?confirmBox("לבטל את ההזמנה?","בטל הזמנה",go):go()});
  const pd=document.getElementById("pdf");if(pd)pd.onclick=async()=>{const o=A().orders.find(x=>x.no===S.openOrder);if(o.pdf){window.open(o.pdf,"_blank");return}pd.textContent="מכין PDF…";try{const r=await call("pdf",{token:S.token,no:o.no});o.pdf=r.url;window.open(r.url,"_blank");render()}catch(e){toast(e.message);render()}};
  const cp=document.getElementById("copy");if(cp)cp.onclick=async()=>{const o=A().orders.find(x=>x.no===S.openOrder);const t=o.lines.map(l=>`${l.item}\t${l.q}\t${l.unit}`).join("\n");try{await navigator.clipboard.writeText(t);toast("הועתק")}catch(e){toast("ההעתקה נחסמה")}};
  // customers
  const nc=document.getElementById("newCust");if(nc)nc.onclick=()=>editCustomer(null);
  app.querySelectorAll("[data-ce]").forEach(b=>b.onclick=()=>editCustomer(+b.dataset.ce));
  app.querySelectorAll("[data-acc]").forEach(i=>i.onchange=()=>adminSave("saveRow",{kind:"customers",row:+i.dataset.acc,data:Object.assign({},(()=>{const c=A().customers.find(x=>x._row===+i.dataset.acc);return{"קוד":c["קוד"],"סיסמה":c["סיסמה"]}})(),{"גישה":i.checked})},i.checked?"ללקוח יש גישה":"הגישה בוטלה"));
  // products
  const np=document.getElementById("newProd");if(np)np.onclick=()=>editProduct(null);
  app.querySelectorAll("[data-pe]").forEach(b=>b.onclick=()=>editProduct(+b.dataset.pe));
  app.querySelectorAll("[data-pz]").forEach(b=>b.onclick=()=>{S.af.pz=b.dataset.pz;render()});
  app.querySelectorAll("[data-ps]").forEach(b=>b.onclick=()=>{S.af.ps=b.dataset.ps;render()});
  const pp=document.getElementById("pp");if(pp)pp.onchange=()=>{S.af.pp=pp.value;render()};
  const pa=document.getElementById("pa");if(pa)pa.onchange=()=>{S.af.pa=pa.value;render()};
  const asb=document.getElementById("assorts");if(asb)asb.onclick=()=>editAssorts();
  const sm=document.getElementById("selMode");if(sm)sm.onclick=()=>{S.af.selMode=!S.af.selMode;if(!S.af.selMode)S.sel.clear();keepScroll(render)};
  const sa=document.getElementById("selAll");if(sa)sa.onclick=()=>{filteredProducts().forEach(p=>S.sel.add(p._row));keepScroll(render)};
  const sc=document.getElementById("selClear");if(sc)sc.onclick=()=>{S.sel.clear();keepScroll(render)};
  app.querySelectorAll("[data-sel]").forEach(i=>i.onchange=()=>{const r=+i.dataset.sel;i.checked?S.sel.add(r):S.sel.delete(r);keepScroll(render)});
  app.querySelectorAll("[data-bulk]").forEach(b=>b.onclick=()=>bulk({active:b.dataset.bulk==="show"},b.dataset.bulk==="show"?"המוצרים מוצגים ללקוחות":"המוצרים הוסתרו"));
  const ba=document.getElementById("bAdd");if(ba)ba.onchange=()=>{if(ba.value)bulk({addTo:ba.value},"נוספו למגוון "+ba.value)};
  const br=document.getElementById("bRem");if(br)br.onchange=()=>{if(br.value)bulk({removeFrom:br.value},"הוסרו מהמגוון "+br.value)};
  app.querySelectorAll("[data-pact]").forEach(i=>i.onchange=()=>{const p=A().products.find(x=>x._row===+i.dataset.pact);adminSave("saveRow",{kind:"products",row:p._row,data:{'מק"ט':p['מק"ט'],"פעיל":i.checked}},i.checked?"המוצר מוצג ללקוחות":"המוצר הוסתר")});
  // promos
  const npr=document.getElementById("newPromo");if(npr)npr.onclick=()=>editPromo(null);
  app.querySelectorAll("[data-pre]").forEach(b=>b.onclick=()=>editPromo(+b.dataset.pre));
  app.querySelectorAll("[data-pract]").forEach(i=>i.onchange=()=>adminSave("saveRow",{kind:"promos",row:+i.dataset.pract,data:{"פעיל":i.checked}},"עודכן"));
  // settings
  const ss=document.getElementById("s_save");if(ss)ss.onclick=e=>{const v=id=>document.getElementById(id).value.trim();
    if(!v("s_pw")){toast("סיסמת מנהל לא יכולה להיות ריקה");return}e.target.disabled=true;
    adminSave("saveSettings",{data:{"שם העסק":v("s_biz"),"מייל הזמנות":v("s_mail"),"וואטסאפ":v("s_wa"),"שעת סגירה":v("s_cut"),"שעת תזכורת":v("s_rh"),"נוסח תזכורת":v("s_rt"),"סיכום יומי":document.getElementById("s_sum").checked?"פעיל":"כבוי","שעת סיכום":v("s_sh"),"סיסמת מנהל":v("s_pw")}},"ההגדרות נשמרו").then(()=>{const b=document.getElementById("s_save");if(b)b.disabled=false})};
}

start();
</script>
